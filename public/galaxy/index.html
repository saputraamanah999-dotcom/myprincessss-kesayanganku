<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000010" />
  <title>Galaxy Love</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./three/build/three.module.js",
        "three/addons/controls/OrbitControls.js": "./three/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/loaders/FontLoader.js": "./three/examples/jsm/loaders/FontLoader.js",
        "three/examples/jsm/geometries/TextGeometry.js": "./three/examples/jsm/geometries/TextGeometry.js"
      }
    }
  </script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    /* Attribution badge stays — original author credit */
    .signature-badge {
      position: fixed;
      bottom: 8px;
      right: 8px;
      font-size: 12px;
      font-family: Arial, sans-serif;
      color: white;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px 10px;
      border-radius: 6px;
      z-index: 9999;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <div id="landscape-warning">
    <div class="warning-content">
      <div class="rotate-icon"></div>
      <h1>Stellar Bloom</h1>
      <h1>Tinh Cầu</h1>
      <div class="stars-bg"></div>
    </div>
  </div>

  <div id="dark-overlay"></div>
  <div id="info"></div>

  <div class="signature-badge">Create by Miko</div>

  <script type="module" src="script.js"></script>
</body>
</html>
